<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interativa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <h1 class="titulo" aria-label="Calculadora Interativa">Calculadora Interativa</h1>
  
  <!-- Contêiner Principal da Calculadora -->
  <main class="calculadora" aria-label="Calculadora Interativa">

    
    <!-- ÁREA DO VISOR (Expressão Superior + Campo Principal) -->
    <div class="painel-visor">
      <!-- Exibe a expressão em andamento no topo à direita -->
      <span id="expressao" class="visor-expressao" aria-hidden="true"></span>
      
      <!-- Input do visor principal pedido no projeto (Etapa 1) -->
      <input 
        type="text" 
        id="visor" 
        class="visor-input" 
        value="0" 
        readonly 
        aria-live="polite" 
        aria-label="Resultado ou número digitado"
      >
    </div>

    <!-- TECLADO DE BOTÕES (4 colunas conforme layout de referência) -->
    <div class="teclado">
      <!-- Linha 1 -->
      <button onclick="limpar()" class="btn btn-limpar" aria-label="Limpar tudo">C</button>
      <button onclick="apagarUltimo()" class="btn btn-funcao" aria-label="Apagar último caractere">&lt;-</button>
      <button onclick="adicionarOperador('%')" class="btn btn-funcao" aria-label="Porcentagem">%</button>
      <button onclick="adicionarOperador('÷')" class="btn btn-operador" aria-label="Dividir">÷</button>

      <!-- Linha 2 -->
      <button onclick="adicionarNumero(7)" class="btn">7</button>
      <button onclick="adicionarNumero(8)" class="btn">8</button>
      <button onclick="adicionarNumero(9)" class="btn">9</button>
      <button onclick="adicionarOperador('x')" class="btn btn-operador" aria-label="Multiplicar">x</button>

      <!-- Linha 3 -->
      <button onclick="adicionarNumero(4)" class="btn">4</button>
      <button onclick="adicionarNumero(5)" class="btn">5</button>
      <button onclick="adicionarNumero(6)" class="btn">6</button>
      <button onclick="adicionarOperador('-')" class="btn btn-operador" aria-label="Subtrair">-</button>

      <!-- Linha 4 -->
      <button onclick="adicionarNumero(1)" class="btn">1</button>
      <button onclick="adicionarNumero(2)" class="btn">2</button>
      <button onclick="adicionarNumero(3)" class="btn">3</button>
      <button onclick="adicionarOperador('+')" class="btn btn-operador" aria-label="Somar">+</button>

      <!-- Linha 5 -->
      
      <button onclick="adicionarNumero('0')" class="btn">0</button>
      <button onclick="adicionarPonto()" class="btn" aria-label="Ponto decimal">.</button>
      <button onclick="calcular()" class="btn btn-igual" aria-label="Calcular resultado">=</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
